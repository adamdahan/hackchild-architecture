name: mirror-docs

# Copies the documents AND the skill into each code repository, so a developer
# who only ever clones `mobile` or `backend` still gets both — with nothing to
# install and no second repository to know about.
#
# Requires a token with `contents: write` and `pull_requests: write` on the
# target repos, stored as the MIRROR_TOKEN secret. GITHUB_TOKEN cannot reach
# another repository.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - '.github/skills/**'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # `secrets` cannot be read in a job-level `if`, so the guard lives on each
    # step via job-level env, which *can* read secrets.
    env:
      MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        target: [hackchild-mobile, hackchild-backend]
    steps:
      - name: Check out the knowledge base
        if: env.MIRROR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out the target repository
        if: env.MIRROR_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.target }}
          token: ${{ secrets.MIRROR_TOKEN }}
          path: target

      - name: Copy documents and skill into the target
        if: env.MIRROR_TOKEN != ''
        run: |
          set -euo pipefail
          cd target

          # Documents go somewhere a human would look, and somewhere an
          # assistant can be pointed at.
          rm -rf docs/architecture
          mkdir -p docs/architecture
          cp -R ../source/docs/.        docs/architecture/
          cp    ../source/index/manifest.tsv docs/architecture/manifest.tsv
          cp    ../source/README.md    docs/architecture/README.md

          # The skill travels with them, so it is present on first clone.
          rm -rf .github/skills/architecture-docs
          mkdir -p .github/skills/architecture-docs
          cp ../source/.github/skills/*/SKILL.md .github/skills/architecture-docs/SKILL.md

          # Copilot reads .github/copilot-instructions.md on every Chat request
          # in this workspace — no slash command, no discovery step. This is the
          # reliable hook; the skill above is the nicer one where supported.
          mkdir -p .github
          cp ../source/.github/copilot-instructions.md .github/copilot-instructions.md

          # The source skill says "the root of this repository". In the mirror
          # that is wrong — rewrite the paths to the mirrored location.
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path(".github/skills/architecture-docs/SKILL.md")
          s = p.read_text()
          # paths are relative to the knowledge base at the source; in the
          # mirror everything sits under docs/architecture/
          s = s.replace("index/manifest.tsv", "docs/architecture/manifest.tsv")
          s = re.sub(r"(?<![\w/])docs/(?!architecture)", "docs/architecture/", s)
          s = s.replace("node tools/build-index.mjs", "(regenerate at the source repository)")
          s = s.rstrip() + (
              "\n\n---\n\n"
              "## This is a mirrored copy\n\n"
              "These documents are generated from the architecture repository and are "
              "**read-only here**. Never edit them in this repo — the next mirror run "
              "overwrites them. Corrections go to the source repository, where the "
              "fingerprint and review machinery lives.\n"
          )
          p.write_text(s)
          PY

          # A note for humans browsing the folder.
          cat > docs/architecture/SYNCED-FROM.txt <<EOF
          source:  ${{ github.repository }}
          commit:  ${{ github.sha }}
          synced:  $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Every repository mirroring this knowledge base should show the same
          commit here. A different value means that clone is behind — run
          \`git pull\` before trusting a disagreement between copies.
          EOF

          cat > docs/architecture/DO-NOT-EDIT.md <<'EOF'
          # Generated — do not edit

          Everything in this folder is mirrored from the architecture repository
          on every merge. Edits here are silently overwritten.

          To correct a document, change it at the source. That is where staleness
          detection and review happen.
          EOF

      - name: Open a mirror pull request if anything changed
        if: env.MIRROR_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          cd target

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "${{ matrix.target }} is already up to date"
            exit 0
          fi

          # A stable branch, force-pushed. One open mirror PR per repo, updated
          # in place — not a new PR every time a document changes.
          BRANCH="docs/mirror"
          git config user.name  "docs-mirror"
          git config user.email "bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A docs/architecture .github/skills/architecture-docs .github/copilot-instructions.md
          git commit -m "docs: sync architecture documents and skill"
          git push -f -u origin "$BRANCH"

          # `gh pr list --head` can lag a force-push, so treat "already exists"
          # as success rather than racing against eventual consistency.
          if ! gh pr create \
              --repo ${{ github.repository_owner }}/${{ matrix.target }} \
              --base main --head "$BRANCH" \
              --title "Sync architecture documents" \
              --body "$(printf 'Mirrored from the architecture repository — this PR updates in place as documents change.\n\nOnce merged, anyone who clones this repository gets the documents, the Copilot instructions, and the lookup skill with no setup.\n\nGenerated. Review is a formality.\n')" 2> pr-err.txt; then
            if grep -q "already exists" pr-err.txt; then
              echo "mirror PR already open — branch updated in place"
            else
              cat pr-err.txt >&2
              exit 1
            fi
          fi
