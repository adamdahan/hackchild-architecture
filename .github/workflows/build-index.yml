name: build-index

on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node tools/build-index.mjs

      - name: Commit the regenerated index
        run: |
          git config user.name  "watchers-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet index/watchers.json; then
            git add index/watchers.json
            git commit -m "chore: regenerate watchers index"
            git push
          fi
