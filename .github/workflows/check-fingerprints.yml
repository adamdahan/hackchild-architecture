name: check-fingerprints

on:
  schedule:
    - cron: '17 6 * * *'      # nightly, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compare fingerprints against live code
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node tools/check-fingerprints.mjs --remote --owner ${{ github.repository_owner }} --write > report.txt 2>&1
          code=$?
          cat report.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Commit any status changes
        if: steps.check.outputs.exit != '0'
        run: |
          git config user.name  "fingerprint-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "docs: flag stale documents"
            git push
          fi

      - name: Fail the run so the badge goes red
        if: steps.check.outputs.exit != '0'
        run: exit 1
